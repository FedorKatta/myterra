<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2eadb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100c" media="(prefers-color-scheme: dark)">
<title>Философия — подготовка к экзамену</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%239b2f1f'/%3E%3Ctext x='12' y='16.6' text-anchor='middle' font-family='Georgia,serif' font-size='14' fill='%23fbf7ee'%3E%CF%86%3C/text%3E%3C/svg%3E">
<style>
/* Философия — «свиток»: пергамент, тушь, киноварь и золото. Шрифты: Cormorant Garamond / Literata / Onest. */
:root {
  --bg: #f2eadb;
  --paper: #fbf7ee;
  --paper-2: #f1e8d6;
  --ink: #2a2017;
  --ink-2: #4a3c2e;
  --muted: #7a6a58;
  --line: #ded0b6;
  --line-2: #cbb997;
  --accent: #9b2f1f;      /* киноварь */
  --accent-2: #7d2418;
  --accent-soft: #f3dfd2;
  --on-accent: #fff8ef;
  --gold: #a57c2c;
  --ok: #3b7a45; --ok-soft: #e1efdd;
  --bad: #b2392a; --bad-soft: #f7dfd8;
  --mid: #b07a1e; --mid-soft: #f6ead0;
  --shadow-1: 0 1px 2px rgba(60, 40, 20, .07), 0 3px 10px rgba(60, 40, 20, .06);
  --shadow-2: 0 14px 34px -14px rgba(60, 40, 20, .35), 0 3px 8px rgba(60, 40, 20, .07);
  --radius: 16px; --radius-s: 11px;
  --ease: cubic-bezier(.22, .9, .25, 1);
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --text: "Literata", Georgia, "Times New Roman", serif;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  /* цвета эпох */
  --e-intro: #b26a12; --e-ant: #a3422b; --e-med: #2d4c86; --e-ren: #247363;
  --e-new: #7a5320; --e-ger: #6a3d7d; --e-xx: #3d4852;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14100c; --paper: #1d1812; --paper-2: #262018; --ink: #eee4d2; --ink-2: #d3c6b1; --muted: #a59683;
    --line: #382e24; --line-2: #4b3e30; --accent: #e8806a; --accent-2: #f0957f; --accent-soft: #3a2119; --on-accent: #1b0e09;
    --gold: #d6ae62; --ok: #86c48c; --ok-soft: #1f3322; --bad: #f08672; --bad-soft: #3c1f19; --mid: #e3b358; --mid-soft: #352a15;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 14px 34px -14px rgba(0, 0, 0, .8);
    --e-intro: #e2a24e; --e-ant: #e3826a; --e-med: #8aa7e4; --e-ren: #6cc3ad; --e-new: #d2a670; --e-ger: #c59ad8; --e-xx: #a9b6c2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14100c; --paper: #1d1812; --paper-2: #262018; --ink: #eee4d2; --ink-2: #d3c6b1; --muted: #a59683;
  --line: #382e24; --line-2: #4b3e30; --accent: #e8806a; --accent-2: #f0957f; --accent-soft: #3a2119; --on-accent: #1b0e09;
  --gold: #d6ae62; --ok: #86c48c; --ok-soft: #1f3322; --bad: #f08672; --bad-soft: #3c1f19; --mid: #e3b358; --mid-soft: #352a15;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 14px 34px -14px rgba(0, 0, 0, .8);
  --e-intro: #e2a24e; --e-ant: #e3826a; --e-med: #8aa7e4; --e-ren: #6cc3ad; --e-new: #d2a670; --e-ger: #c59ad8; --e-xx: #a9b6c2;
}
[data-era="intro"] { --era: var(--e-intro); } [data-era="ant"] { --era: var(--e-ant); } [data-era="med"] { --era: var(--e-med); }
[data-era="ren"] { --era: var(--e-ren); } [data-era="new"] { --era: var(--e-new); } [data-era="ger"] { --era: var(--e-ger); } [data-era="xx"] { --era: var(--e-xx); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 400 16px/1.6 var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(1200px 600px at 10% -10%, rgba(165, 124, 44, .10), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(155, 47, 31, .07), transparent 60%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "lnum" 1;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }

/* появление страниц */
#app { min-height: 100vh; }
#app.enter-fwd .page, #app.enter-back .page, #app.enter-swap .page { opacity: 0; transform: translateY(10px); }
#app.enter-back .page { transform: translateY(-6px); }
#app.in .page { opacity: 1; transform: none; transition: opacity .45s var(--ease), transform .55s var(--ease); }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
.wrap.narrow { max-width: 640px; }

/* шапка */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px max(12px, calc((100% - 800px) / 2));
  padding-top: max(6px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.3) blur(10px); -webkit-backdrop-filter: saturate(1.3) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .back { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; cursor: pointer; color: var(--ink); }
.topbar .back:hover { background: var(--paper-2); }
.tb-title { flex: 1; min-width: 0; font: 600 21px/1.2 var(--serif); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-extra { font: 500 13px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress { position: sticky; top: 56px; z-index: 19; height: 3px; background: var(--line); }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent)); transition: width .5s var(--ease); }

/* главная */
.hero { position: relative; color: var(--ink); padding: max(14px, env(safe-area-inset-top)) 16px 0; }
.hero-top { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.crumb { display: inline-flex; align-items: center; gap: 6px; font: 500 14px var(--ui); color: var(--muted); text-decoration: none; padding: 6px 10px 6px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
.crumb .i { width: 17px; height: 17px; }
.crumb:hover { color: var(--ink); border-color: var(--line-2); }
.hero-greek { font: italic 500 20px var(--serif); color: var(--gold); letter-spacing: .03em; }
.hero-body { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 0 22px; }
.kicker { margin: 0 0 4px; font: 600 12px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.hero h1 { margin: 0; font: 600 clamp(52px, 13vw, 88px)/.95 var(--serif); letter-spacing: -.01em; }
.hero-lead { margin: 14px 0 0; max-width: 34em; color: var(--ink-2); font-size: 16px; }
.ring { position: relative; flex: none; width: 128px; height: 128px; display: grid; place-items: center; text-decoration: none; color: var(--ink); }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); }
.ring-num { position: relative; text-align: center; line-height: 1.05; }
.ring-num b { display: block; font: 600 38px var(--serif); }
.ring-num small { font: 500 11px/1.25 var(--ui); color: var(--muted); }
.meander { display: block; width: 100%; height: 12px; color: var(--gold); opacity: .55; }
.resume { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center; margin: 20px 0 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--ink); color: var(--paper); text-decoration: none; box-shadow: var(--shadow-2); transition: transform .3s var(--ease); }
.resume:hover { transform: translateY(-2px); }
.r-lbl { grid-column: 1 / 3; font: 600 11px var(--ui); letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.r-num { font: 600 26px var(--serif); color: var(--gold); }
.r-title { font: 500 15px/1.35 var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.resume .i { grid-row: 1 / 3; grid-column: 3; }
.sec { margin: 28px 0 12px; font: 600 12px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.modes { display: grid; gap: 10px; }
@media (min-width: 640px) { .home .modes { grid-template-columns: 1fr 1fr; } }
.mode {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; text-align: left; text-decoration: none; color: var(--ink);
  padding: 16px; border-radius: var(--radius); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); cursor: pointer;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
}
.mode:hover:not([disabled]) { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
.mode:active:not([disabled]) { transform: translateY(0) scale(.99); }
.mode[disabled] { opacity: .5; cursor: default; }
.m-ico { grid-row: 1 / 3; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.m-ico .i { width: 23px; height: 23px; }
.m-txt b { display: block; font: 600 21px/1.15 var(--serif); }
.m-txt small { display: block; margin-top: 3px; font: 400 14px/1.45 var(--text); color: var(--muted); }
.m-meta { grid-column: 2; font: 500 12.5px var(--ui); color: var(--gold); }
.foot { margin: 28px 0 0; text-align: center; font: 400 13px var(--ui); color: var(--muted); }

/* кнопки, чипы */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font: 600 15px var(--ui); cursor: pointer;
  transition: transform .2s var(--ease), background .2s, box-shadow .2s; text-decoration: none;
}
.btn:hover:not(:disabled) { background: var(--accent-2); box-shadow: var(--shadow-1); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover:not(:disabled) { background: var(--paper-2); }
.btn.ghost.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.btn.danger { background: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.wide { width: 100%; margin-top: 12px; }
.btn .badge { font: 600 12px var(--ui); padding: 2px 8px; border-radius: 999px; background: rgba(255, 255, 255, .22); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btnrow .btn { flex: 1 1 140px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 10px -16px; padding: 2px 16px; }
.chips.scroll-x::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink-2); font: 500 14px var(--ui); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.era { border-color: color-mix(in srgb, var(--era) 55%, var(--line)); color: var(--era); }
.chip.era.on { background: var(--era); border-color: var(--era); color: var(--paper); }
.era-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 11.5px var(--ui); letter-spacing: .04em; color: var(--era); background: color-mix(in srgb, var(--era) 13%, transparent); border: 1px solid color-mix(in srgb, var(--era) 35%, transparent); }
.note-card { margin-top: 16px; padding: 14px 16px; border-radius: var(--radius); background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--gold); color: var(--ink-2); font-size: 15px; }
.note-card p { margin: 0; }
.sticky-cta { position: sticky; bottom: 0; z-index: 5; padding: 8px 0 max(10px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); }
.best { margin: 12px 0 0; font: 400 14px var(--ui); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 0; font-style: italic; }
.hint { color: var(--ink-2); font-style: italic; margin: 16px 0 0; }

/* поиск и список билетов */
.search { margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 48px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line-2); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 16px var(--ui); height: 46px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 0; font: 400 12.5px var(--ui); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .i { width: 15px; height: 15px; color: var(--ok); }
.legend i.st-pct { font-style: normal; }
.era-h { position: sticky; top: 56px; z-index: 4; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 22px -16px 4px; padding: 10px 16px 8px; font: 600 22px/1.2 var(--serif); color: var(--era); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid color-mix(in srgb, var(--era) 30%, var(--line)); }
.era-h small { font: 500 12px var(--ui); color: var(--muted); }
.trow { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: background .2s; border-radius: 8px; }
.trow:hover { background: var(--paper); }
.t-num { font: 600 26px/1 var(--serif); color: var(--era); text-align: center; }
.t-title { font: 400 15.5px/1.4 var(--text); }
.t-st { display: flex; align-items: center; gap: 6px; }
.st-read { color: var(--ok); display: inline-flex; }
.st-read .i { width: 18px; height: 18px; }
.st-pct { font: 600 12px var(--ui); padding: 2px 7px; border-radius: 999px; }
.st-pct.good, .good.st-pct { color: var(--ok); background: var(--ok-soft); }
.st-pct.mid { color: var(--mid); background: var(--mid-soft); }
.st-pct.low { color: var(--bad); background: var(--bad-soft); }
.st-self { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.st-self.good { background: var(--ok); } .st-self.part { background: var(--mid); } .st-self.bad { background: var(--bad); }

/* страница билета */
.t-head { padding: 26px 0 6px; }
.t-meta { display: flex; align-items: center; gap: 10px; }
.t-no { font: 600 12px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.t-head h1 { margin: 12px 0 0; font: 600 clamp(30px, 7.4vw, 44px)/1.08 var(--serif); letter-spacing: -.005em; }
.t-lead { margin: 14px 0 0; font: italic 400 17px/1.6 var(--text); color: var(--ink-2); padding-left: 14px; border-left: 2px solid var(--era); }
.plan { margin: 22px 0 6px; padding: 16px 18px 12px; border-radius: var(--radius); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.plan-h { font: 600 12px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.plan ol { margin: 0; padding-left: 22px; }
.plan li { padding: 4px 0; font-size: 15.5px; }
.plan li::marker { font: 600 16px var(--serif); color: var(--gold); }
.plan a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line-2); }
.plan a:hover { color: var(--accent); border-color: var(--accent); }
.prose { font-size: 16.5px; line-height: 1.72; }
.prose h3 { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 10px; font: 600 26px/1.2 var(--serif); }
.prose h3 .sn { flex: none; width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 50%; font: 600 14px var(--ui); color: var(--paper); background: var(--era); transform: translateY(-3px); }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 6px 0 14px; padding: 0; list-style: none; }
.prose li { position: relative; padding: 3px 0 3px 22px; }
.prose li::before { content: ""; position: absolute; left: 4px; top: .78em; width: 7px; height: 7px; border-radius: 50%; background: var(--era); opacity: .8; }
.prose li.sub { margin-left: 22px; }
.prose li.sub::before { width: 5px; height: 5px; background: transparent; border: 1.5px solid var(--era); }
.prose li.num::before { content: attr(data-n); width: auto; height: auto; top: 3px; left: 0; background: none; font: 600 16px var(--serif); color: var(--era); opacity: 1; }
.prose b { font-weight: 600; color: var(--ink); }
.prose blockquote { margin: 14px 0; padding: 12px 16px 12px 44px; position: relative; background: var(--paper); border-radius: var(--radius-s); font: italic 500 20px/1.45 var(--serif); color: var(--ink); border: 1px solid var(--line); }
.prose blockquote::before { content: "“"; position: absolute; left: 12px; top: -2px; font: 600 50px/1 var(--serif); color: var(--gold); }
.remember { margin: 26px 0 8px; padding: 16px 18px; border-radius: var(--radius); background: var(--ink); color: var(--paper); font-size: 15.5px; line-height: 1.6; box-shadow: var(--shadow-2); }
.remember .lbl { display: block; margin-bottom: 6px; font: 600 11.5px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.block { margin-top: 8px; }
.terms { margin: 0; display: grid; gap: 8px; }
.terms > div { padding: 12px 14px; border-radius: var(--radius-s); background: var(--paper); border: 1px solid var(--line); }
.terms dt { font: 600 19px/1.25 var(--serif); color: var(--accent); }
.terms dd { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.terms.compact dt { font-size: 17px; }
.terms.compact dd { font-size: 14.5px; }
.plist { display: grid; gap: 8px; }
@media (min-width: 640px) { .plist, .terms:not(.compact) { grid-template-columns: 1fr 1fr; } }
.pcard { padding: 12px 14px; border-radius: var(--radius-s); background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--era); }
.p-name { font: 600 19px/1.2 var(--serif); }
.p-years { font: 500 12.5px var(--ui); color: var(--gold); margin-top: 2px; }
.p-idea { margin-top: 6px; font-size: 14.5px; color: var(--ink-2); }
.p-works { margin-top: 6px; font: italic 13.5px/1.45 var(--text); color: var(--muted); }
.actions { margin-top: 28px; padding: 16px; border-radius: var(--radius); background: var(--paper-2); border: 1px solid var(--line); }
.actions > .btn { width: 100%; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pn a { display: block; padding: 12px 14px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--paper); text-decoration: none; color: var(--ink); min-width: 0; }
.pn a:hover { border-color: var(--line-2); }
.pn small { display: block; font: 600 12px var(--ui); color: var(--accent); }
.pn span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }

  text: `## Происхождение и определение
Слово «философия» — от греч. *philia* (любовь) и *sophia* (мудрость), то есть «любовь к мудрости». По преданию, термин ввёл **Пифагор**: мудрым может быть только бог, человек же — лишь любящий мудрость.
Философия — форма мировоззрения и особый вид знания, который рационально (с помощью понятий и доказательств) исследует всеобщее: отношение «человек — мир», природу бытия, познания, ценностей.
## Философия среди типов мировоззрения
- **Миф** — образное, нерасчленённое, некритическое объяснение мира через сказание о богах и героях.
- **Религия** — мировоззрение, основанное на вере в сверхъестественное, на откровении и культе.
- **Философия** — мировоззрение, основанное на разуме, доказательстве и критике; она ставит под вопрос даже очевидное.
Аристотель: философия начинается с **удивления**.
## Основной вопрос и направления
Ф. Энгельс назвал основным вопросом философии отношение мышления к бытию (сознания к материи).
- Что первично? **Материализм** — материя; **идеализм** — сознание (объективный — Платон, Гегель; субъективный — Беркли).
- **Монизм** (одно начало), **дуализм** (два — Декарт), **плюрализм** (много).
- Познаваем ли мир? Оптимизм в познании против **агностицизма** (Юм, Кант) и **скептицизма**.
## Структура философского знания
- **Онтология** — учение о бытии (термин Р. Гоклениуса, 1613); **метафизика** — учение о первоначалах сущего.
- **Гносеология (эпистемология)** — теория познания.
- **Логика** — законы и формы правильного мышления.
- **Этика** — мораль и нравственность; **эстетика** — прекрасное и искусство.
- **Аксиология** — учение о ценностях.
- **Философская антропология** — сущность человека.
- **Социальная философия** и **философия истории** — общество и смысл истории.
- **Философия науки**, философия религии, права, культуры, техники, сознания.
## Функции философии
Мировоззренческая, методологическая, гносеологическая (познавательная), критическая, аксиологическая (ценностная), прогностическая, воспитательная, интегративная.

- **Древний Восток** (Индия, Китай; с VII–VI вв. до н. э.). К. Ясперс: «осевое время» — VIII–II вв. до н. э.
- **Античность** — VI в. до н. э. – VI в. н. э. (до закрытия Академии в 529 г.).
- **Средние века** — II/V – XIV вв. (патристика, схоластика).
- **Возрождение** — XIV–XVI вв.
- **Новое время и Просвещение** — XVII–XVIII вв.
- **Классическая немецкая философия** — конец XVIII – середина XIX в.
- **Неклассическая** (вторая половина XIX – XX в.) и **современная** философия.
! Философия = любовь к мудрости; основной вопрос — отношение мышления к бытию; ядро — онтология, гносеология, этика, логика.`,

  lead: 'Первые греческие философы — «физики», или натурфилософы, — объясняли природу из неё самой, искали её первоначало и тем самым совершили переход от мифа к логосу.',
  text: `## Кто такие «физики»
Аристотель называл первых философов **физиками** или **фюсиологами** — исследователями *physis* (природы). Это мыслители VI–V вв. до н. э.: милетцы, Гераклит, пифагорейцы, Эмпедокл, Анаксагор, атомисты.
## От мифа к логосу
Миф объяснял мир через волю богов и рассказ о происхождении (теогония Гесиода). «Физики» впервые:

- **Космоцентризм**: мир — упорядоченный, прекрасный космос, человек — его часть (микрокосм).
- **Рационализм**: опора на разум, доказательство, диалог.
- **Синкретизм**: философия ещё не отделена от науки — математики, физики, медицины.
- Поиск **первоначала** (архэ) и законов бытия.
- **Этико-политическая** направленность: связь с жизнью полиса, идеал гражданина.
- Созерцательность (*теория* — «созерцание»), идеал мудреца.
## Периодизация
**1. Досократический (натурфилософский), VI–V вв. до н. э.**
Милетская школа (Фалес, Анаксимандр, Анаксимен), Гераклит, пифагорейцы, элеаты (Парменид, Зенон), Эмпедокл, Анаксагор, атомисты (Левкипп, Демокрит). Главный вопрос — из чего состоит мир.
**2. Классический, V–IV вв. до н. э.**
«Антропологический поворот»: софисты и **Сократ** обращаются к человеку, морали и познанию. Великие системы **Платона** (Академия) и **Аристотеля** (Ликей).
**3. Эллинистический, конец IV – I в. до н. э.**
После походов Александра Македонского полис теряет значение; философия ищет личное счастье и спокойствие: **эпикуреизм**, **стоицизм**, **скептицизм**, **кинизм**.
**4. Римский, I в. до н. э. – V/VI в. н. э.**
Лукреций Кар, Цицерон, стоики Сенека, Эпиктет, Марк Аврелий; **неоплатонизм** (Плотин, Порфирий, Прокл) — последняя великая языческая система; встреча с христианством.
## Значение
Античность создала основные понятия (бытие, идея, материя, форма, логос, атом, космос, причина), логику (Аристотель), типы философствования (материализм Демокрита и идеализм Платона) и образец свободного рационального поиска истины.

  lead: 'Гераклит — «Тёмный» философ из Эфеса: первоначало мира — огонь, всё течёт и изменяется, миром правит логос, а противоположности едины и борются. Его считают основоположником диалектики.',
  text: `## Жизнь и сочинение
**Гераклит** (ок. 544/540 – ок. 480 до н. э.), Эфес (Иония), из царского рода, отказался от наследственного сана в пользу брата. Презирал толпу, удалился от дел. Прозвища — **«Тёмный»** (за загадочный, афористичный стиль) и **«плачущий философ»** (в паре с «смеющимся» Демокритом).

## Основные идеи
- **Огонь** — первоначало: мир — «вечно живой огонь, мерами загорающийся и мерами угасающий»; всё обменивается на огонь, как товары на золото.

- **Логос** — всеобщий разумный закон мира, «общий для всех», который люди не понимают.
- **Единство и борьба противоположностей**: из борьбы рождается гармония, как у натянутого лука и лиры.
- **Относительность** качеств: одно и то же благо для одних и зло для других.
- Познание: чувства — плохие свидетели для «варварских душ»; мудрость — в постижении логоса, а не во многознании.

  text: `## Жизнь

  lead: 'Письмо — «внешняя память» и технология мышления. Греческий алфавит с гласными сделал возможными накопление и критику текстов, а значит, философию и науку. Платон в «Федре» сомневался в пользе письма; печатный станок Гутенберга и цифровая эпоха вновь изменили мышление.',
  text: `## Этапы развития письма
- **Пиктография** и **клинопись** (Шумер, ок. 3200 г. до н. э.) — для хозяйственного учёта, законов (законы Хаммурапи).

- **Финикийское** консонантное (только согласные) письмо, ок. XI в. до н. э.
- **Греческий алфавит** (VIII в. до н. э.) — впервые с **гласными**: два-три десятка знаков позволяют записать любую речь; письмо становится доступным гражданам.
- Затем латиница, кириллица (IX в.), **книгопечатание** Гутенберга (ок. 1450 г.), цифровая письменность.
## Письмо как технология мышления
Письмо — не просто запись речи, а **инструмент**, который меняет мышление:

## Платон о письменности: миф о Тевте
В диалоге **«Федр»** египетский бог Тевт (Тот) предлагает царю Тамусу письмена как средство для памяти и мудрости. Царь отвечает: письмо даст не память, а лишь **напоминание**, породит забывчивость и **видимость мудрости**; написанный текст не может ответить на вопросы и защитить себя. Живая устная беседа (диалектика) выше письма. Парадокс: Платон сам записал диалоги, а Сократ не писал ничего.
Ж. Деррида («Фармация Платона») увидел в письме **фармакон** — одновременно лекарство и яд — и критиковал «фоноцентризм» (приоритет устной речи) западной метафизики.

- **Фиксация** наблюдений и данных (астрономические таблицы Вавилона).

  title: 'Экономические воззрения Аристотеля в контексте его философского учения',
  lead: 'Аристотель различал экономику (естественное ведение хозяйства ради потребностей) и хрематистику (безграничную наживу), осуждал ростовщичество, выделил потребительную и меновую стоимость, учил о деньгах как мере обмена и о справедливости в обмене. Всё это вытекает из его телеологии и этики середины.',
  text: `## Аристотель и его система
**Аристотель** (384–322 до н. э.), из Стагиры; 20 лет учился в Академии Платона, был воспитателем Александра Македонского, в 335 г. до н. э. основал в Афинах **Ликей** (школа перипатетиков — «прогуливающихся»).
Философский контекст экономики:
- **Телеология**: всё имеет цель (телос); цель человека — **эвдемония** (счастье) как деятельность души согласно добродетели.
- **Этика середины** (мезотес): добродетель — середина между крайностями (щедрость — между скупостью и расточительностью).
- Человек — **политическое животное** (*zōon politikon*); полис существует ради благой жизни.
Экономические идеи — в I книге **«Политики»** и V книге **«Никомаховой этики»**.
## Экономика и хрематистика
- **Ойкономия** (от *ойкос* — дом и *номос* — закон) — искусство ведения домашнего хозяйства, добывание необходимого для жизни. Оно **естественно** и имеет **предел** — удовлетворение потребностей.
- **Хрематистика** — искусство наживы, накопления денег ради самих денег. Она **безгранична** и противоестественна, потому что средство (деньги) превращается в цель.
Аристотель допускает естественную, «меновую» хрематистику (обмен излишков), но осуждает торговлю ради прибыли.
## Ростовщичество
Самый противоестественный вид наживы — **ростовщичество**: деньги созданы для обмена, а не для того, чтобы «рождать» деньги. Греческое *токос* — и «процент», и «приплод, потомство»: «деньги, родившиеся от денег». Эта идея определила отношение к проценту в средневековой схоластике.
## Потребительная и меновая стоимость
> Каждая вещь имеет двоякое применение: сандалией можно пользоваться для обувания и для обмена.
Аристотель впервые различил **потребительную** и **меновую** стоимость; К. Маркс назвал его «великим исследователем», впервые проанализировавшим форму стоимости.
## Деньги
Деньги возникли для **соизмерения** разнородных товаров в обмене, они — «мера всех вещей» в хозяйстве и существуют **по установлению**, а не по природе (греч. *номисма* — от *номос*, закон): их можно изменить или сделать бесполезными.
## Справедливость в экономике
- **Распределяющая** справедливость — распределение благ и почестей **по достоинству** (геометрическая пропорция).
- **Уравнивающая (коммутативная)** — в обмене и сделках: равенство обмениваемого (арифметическая пропорция). Отсюда схоластическая идея **справедливой цены**.
## Собственность и полис
- Против коммунизма Платона: **частная собственность** лучше, так как «то, что принадлежит всем, заботит меньше всего»; идеал — собственность частная, а пользование — отчасти общее.
- **Рабство** Аристотель считал естественным: раб — «одушевлённое орудие».
- Лучший строй — **полития** с опорой на **средний класс** (умеренное богатство).
## Влияние
Идеи Аристотеля стали основой экономической мысли средневековья (Фома Аквинский — справедливая цена, запрет процента), повлияли на Маркса и критику «экономики ради наживы» вплоть до современной экономической этики.

{
  n: 17, era: 'ant',
  title: 'Концепт «причина» в античной философии',
  lead: 'Античные мыслители прошли путь от поиска материального начала к развитой теории причин. Демокрит учил о всеобщей необходимости, Платон — об идеях как причинах, Аристотель выделил четыре причины: материальную, формальную, движущую и целевую.',
  text: `## Слово и понятие
Греч. *aitia* — «вина», «ответственность», затем «причина»: то, что «виновно» в существовании или изменении вещи. Близко к понятию **архэ** (начало). Познать вещь — значит знать её причины (Аристотель).
## Досократики
- **Милетцы** искали «то, из чего» — материальное начало (вода, апейрон, воздух).
- **Эмпедокл** добавил **движущие** силы — Любовь и Вражду.
- **Анаксагор** — **Ум** (Нус) как причину порядка; Сократ и Аристотель упрекали его в том, что он не довёл эту идею до конца.
- **Левкипп и Демокрит** — **детерминизм**: «Ни одна вещь не возникает беспричинно, но всё возникает на каком-либо основании и в силу необходимости». Демокрит: «я предпочёл бы найти одно причинное объяснение, чем получить персидский престол»; случайность — лишь незнание причин.
## Платон

- В «Тимее»: «всё возникающее необходимо возникает по какой-то причине»; причина космоса — благой **Демиург**.
## Аристотель: учение о четырёх причинах

## Основные направления

**Ибн Сина (Авиценна)** (980–1037), Бухара — Хамадан:
- «**Книга исцеления**» (Китаб аш-шифа) — энциклопедия философии; «**Канон врачебной науки**» — учебник медицины в Европе до XVII в.;

**Аль-Газали** (1058–1111): «**Опровержение философов**» (Тахафут аль-фаласифа) — критика вечности мира и причинности: огонь не сжигает хлопок сам, это делает Бог (окказионализм, предвосхищение Юма); путь к истине — суфийский опыт.
**Ибн Рушд (Аверроэс)** (1126–1198), Кордова:

  text: `## Понятие и особенности
Схоластика (от лат. *schola* — школа) — философия, преподававшаяся в монастырских и соборных школах, затем в **университетах** (Болонья, 1088; Париж, ок. 1200; Оксфорд).
Особенности:
- задача — **рациональное обоснование** и систематизация вероучения;
- опора на **авторитеты** (Библия, отцы Церкви, с XIII в. — **Аристотель**, «Философ»);
- **формально-логический** метод, точные определения и различения;
- жанры: **комментарий**, **сентенции** (своды мнений — Пётр Ломбардский), **сумма** (энциклопедический свод), **вопрос** (*quaestio*) с доводами «за» и «против», **диспут**;

- **Ансельм Кентерберийский** (1033–1109) — «отец схоластики»:

Возвращение Аристотеля через арабов; нищенствующие ордена — доминиканцы и францисканцы.

  - Душа — форма тела; естественный закон; справедливая цена.

- **Иоанн Дунс Скот** (ок. 1266–1308), «Тонкий доктор»: примат **воли** над разумом; *haecceitas* («этость») — принцип индивидуальности вещи.

  text: `## Что такое универсалии

## Источник спора: Порфирий и Боэций
Неоплатоник **Порфирий** в «**Введении (Исагоге)**» к «Категориям» Аристотеля (III в.) поставил три вопроса, но не дал ответа:

## Основные позиции

- **Уильям Оккам** (XIV в.): универсалии — **знаки** (термины), обозначающие множество сходных вещей; «бритва Оккама» отсекает лишние сущности.
**3. Концептуализм** — общее существует **в уме как понятие** (*conceptus*), выражающее сходство вещей; не просто звук, но смысловое значение слова (*sermo*).
Представитель: **Пьер Абеляр** — ученик и Росцелина, и Гильома из Шампо, критиковал обоих.
**4. Умеренный реализм** — универсалии существуют **трояко**:
- **до вещей** — в уме Бога как идеи-образцы;

## Почему это важно

  text: `## Рамки и предпосылки
Новое время — XVII–XVIII вв. (иногда — до начала XIX в.). Предпосылки:

- **Гносеологизм**: центральная проблема — познание, его источники и **метод** («как получить достоверное знание?»).

## Основные представители
**Эмпиризм** (Англия): **Фрэнсис Бэкон** — родоначальник; **Томас Гоббс**; **Джон Локк**; **Джордж Беркли** (субъективный идеализм); **Дэвид Юм** (скептицизм).
**Рационализм** (континент): **Рене Декарт** — родоначальник; **Бенедикт Спиноза**; **Готфрид Вильгельм Лейбниц**.

## Социальная философия
**Томас Гоббс** (1588–1679), «**Левиафан**» (1651):

- **разделение властей** (законодательная, исполнительная, федеративная); веротерпимость.
**Гуго Гроций** — естественное и международное право («О праве войны и мира», 1625).
## Значение
Новое время создало философское обоснование науки, понятие метода, идеи прав человека и правового государства, либерализма; подготовило Просвещение и классическую немецкую философию.

  text: `## Принципы рационализма
- Источник достоверного знания — **разум**, а не чувства (они обманчивы).
- **Врождённые идеи** (Бог, «я», математические аксиомы).
- Метод — **дедукция**: от ясных и очевидных начал к следствиям.
- Образец знания — **математика** (геометрический метод).
- Критерий истины — **ясность и отчётливость** идей.
## Рене Декарт (1596–1650)
Французский философ и математик, основатель рационализма и «отец новой философии». Труды: «**Рассуждение о методе**» (1637), «**Размышления о первой философии**» (1641), «**Начала философии**» (1644), «Страсти души». Создал **аналитическую геометрию** (декартовы координаты).
**Методическое сомнение**: нужно подвергнуть сомнению всё, что возможно (чувства, мир, даже математику — вдруг нас обманывает «злой гений»). Несомненным остаётся сам факт сомнения, то есть мышления:
> Мыслю, следовательно, существую (Cogito, ergo sum).
**Четыре правила метода** («Рассуждение о методе»):
1. **очевидность**: принимать за истинное только то, что ясно и отчётливо;
2. **анализ**: делить трудность на части;
3. **синтез**: идти от простого к сложному;
4. **перечисление**: делать полные обзоры, ничего не упуская.
**Дуализм**: две независимые субстанции — **мыслящая** (*res cogitans*, душа, сознание) и **протяжённая** (*res extensa*, тело, материя); их связь — через **шишковидную железу** (психофизическая проблема). Животные — сложные автоматы. Бог — бесконечная субстанция, гарант истинности ясных идей («Бог не обманщик»).
## Бенедикт (Барух) Спиноза (1632–1677)
Нидерланды; в 1656 г. отлучён от еврейской общины Амстердама, зарабатывал шлифовкой линз. «**Этика, доказанная в геометрическом порядке**» (1677), «Богословско-политический трактат» (1670).
- **Монизм**: существует единственная субстанция — **Бог, или Природа** (*Deus sive Natura*) — **пантеизм**; она причина самой себя (*causa sui*).
- У субстанции бесконечно много **атрибутов**, нам известны два — **мышление и протяжение**; единичные вещи — **модусы** (состояния) субстанции. Так снимается дуализм Декарта.
- **Детерминизм**: всё необходимо; **свобода — это познанная необходимость**.
- Этика: преодоление аффектов разумом; высшее благо — «**интеллектуальная любовь к Богу**».
- «Не плакать, не смеяться, не проклинать, а понимать».
- Защита свободы мысли и слова; государство — ради свободы.
## Готфрид Вильгельм Лейбниц (1646–1716)
Немецкий универсальный учёный: **дифференциальное и интегральное исчисление** (параллельно с Ньютоном), **двоичная система**, проект вычислительной машины, основание Берлинской академии наук. Труды: «**Монадология**» (1714), «**Теодицея**» (1710), «Новые опыты о человеческом разумении» (ответ Локку).
- **Плюрализм**: мир состоит из бесконечного множества простых духовных субстанций — **монад**; каждая отражает всю Вселенную; «**монады не имеют окон**» — не взаимодействуют.
- Согласованность монад — **предустановленная гармония**, заложенная Богом (как синхронно идущие часы).

- **Закон достаточного основания**: ничто не происходит без причины; **истины разума** (необходимые) и **истины факта** (случайные).
- Против tabula rasa Локка: «нет ничего в разуме, чего не было бы в чувствах, **кроме самого разума**».
## Значение
Рационализм обосновал математическое естествознание, идею единого научного метода, автономии разума; противостоял эмпиризму, а их спор разрешал Кант.

Основная традиция — британская (XVII–XVIII вв.).
## Фрэнсис Бэкон (1561–1626)
Английский философ и лорд-канцлер, родоначальник эмпиризма и опытной науки. «**Новый Органон**» (1620; против «Органона» Аристотеля), «Великое восстановление наук», «Новая Атлантида».
- «**Знание — сила**»: цель науки — власть человека над природой, практическая польза.
- **Индуктивный метод**: систематический сбор фактов, **таблицы присутствия, отсутствия и степеней**, отбрасывание неподходящих случаев.

## Томас Гоббс
Материалист-эмпирик: всё сущее — тела в движении; познание начинается с ощущений; мышление — счёт (сложение и вычитание понятий).

Ирландский епископ, «**Трактат о принципах человеческого знания**» (1710).

- Вещь — **комплекс ощущений**; материи как независимой субстанции нет — **субъективный идеализм** (имматериализм).
- Постоянство мира обеспечивается тем, что его всегда воспринимает **Бог**.
## Дэвид Юм (1711–1776)
Шотландский философ, историк и экономист. «**Трактат о человеческой природе**» (1739–1740), «**Исследование о человеческом познании**» (1748).

{
  n: 36, era: 'ger',

  lead: 'Кант совершил «коперниканский переворот»: не познание сообразуется с предметами, а предметы — с формами познания. Пространство и время — априорные формы чувственности, категории — формы рассудка; вещь в себе непознаваема. В этике — категорический императив и автономия воли.',
  text: `## Жизнь и периоды
**Иммануил Кант** (1724–1804) всю жизнь прожил в **Кёнигсберге** (ныне Калининград), профессор логики и метафизики.
- **Докритический период** (до 1770): естественнонаучные работы; «**Всеобщая естественная история и теория неба**» (1755) — **небулярная гипотеза** происхождения Солнечной системы из туманности (гипотеза Канта — Лапласа).
- **Критический период** (с 1770/1781): исследование способностей разума.
## Главные труды и вопросы
- «**Критика чистого разума**» (1781) — *что я могу знать?*
- «**Критика практического разума**» (1788) — *что я должен делать?*
- «**Критика способности суждения**» (1790) — эстетика и целесообразность;
- «Религия в пределах только разума» (1793) — *на что я могу надеяться?*
- «Антропология» — *что такое человек?* (к этому сводятся все вопросы).
- Также «Основоположение к метафизике нравов» (1785), «**К вечному миру**» (1795), «Что такое Просвещение?» (1784).
## Коперниканский переворот
До Канта считали: знание должно сообразовываться с предметами. Кант: **предметы сообразуются с нашим способом познания** — субъект сам вносит в опыт всеобщие формы. Это **трансцендентальный идеализм** (*трансцендентальное* — то, что делает опыт возможным).
## Основные понятия
- **Априорное** (до опыта, всеобщее и необходимое) и **апостериорное** (из опыта).
- **Аналитические** суждения (поясняют: «все тела протяжённы») и **синтетические** (расширяют знание: «все тела тяжелы»).
- Главный вопрос: **как возможны синтетические суждения a priori?** — в математике, естествознании и метафизике.
- **Вещь в себе** (ноумен) — вещь как она есть независимо от нас, **непознаваема**; **явление** (феномен) — вещь, какой она нам дана. Отсюда агностицизм Канта.

## Три источника (по Ленину)

- **Общественно-экономические формации**: первобытнообщинная → рабовладельческая → феодальная → капиталистическая → коммунистическая (особо — «азиатский способ производства»).

  text: `## Лингвистический поворот
Термин популяризировал Р. Рорти (сборник «The Linguistic Turn», 1967). Суть: **философские проблемы возникают из неправильного употребления языка** и должны решаться через **анализ языка**. Если классическая философия спрашивала «что есть бытие?» (онтология), а Новое время — «как мы познаём?» (гносеология), то XX век спрашивает: «**что значат наши слова и как язык связан с миром?**»
Этим начинается **аналитическая философия**.
## Основатели логического анализа
- **Готлоб Фреге** (1848–1925): логика предикатов («Исчисление понятий», 1879); различие **смысла и значения** (*Sinn* и *Bedeutung*) — «Утренняя звезда» и «Вечерняя звезда» имеют разный смысл, но одно значение (Венера).

- Философия — не учение, а **деятельность** по прояснению мыслей.
## Логический позитивизм (Венский кружок)
**Венский кружок** (1920–1930-е гг.): **Мориц Шлик** (руководитель), **Рудольф Карнап**, **Отто Нейрат**, Ганс Хан, Герберт Фейгль, Фридрих Вайсман; в контакте — К. Гёдель, Витгенштейн, Поппер. Манифест «**Научное понимание мира**» (1929). Берлинская группа — **Г. Рейхенбах**. В Англии — **А. Айер** («Язык, истина и логика», 1936).
Идеи:
- **Принцип верификации**: осмысленно лишь предложение, которое можно **проверить опытом** (сопоставить с фактами); значение предложения — способ его проверки.
- Осмысленные предложения: **аналитические** (логика, математика — тавтологии) и **синтетические** эмпирические (наука).

- **Протокольные предложения** — фиксация непосредственного опыта как основа знания.
- **Физикализм** и **единство науки**: все науки — на языке физики.
- Философия = **логический анализ языка науки**.
- Эмиграция членов кружка в США после 1938 г. — расцвет аналитической философии там.
## Поздний Витгенштейн и философия обыденного языка
«**Философские исследования**» (1953, посмертно):
- **Значение слова — это его употребление** в языке.
- **Языковые игры** — разнообразные практики употребления языка, связанные с «**формами жизни**».
- **Семейное сходство**: у понятия «игра» нет общей сущности, лишь пересекающиеся сходства.

- Философия «лечит» от путаницы: показать «мухе выход из мухоловки».
**Оксфордская школа обыденного языка**: **Гилберт Райл** («Понятие сознания», 1949 — «дух в машине» как категориальная ошибка), **Джон Остин** («Как совершать действия при помощи слов» — **речевые акты**, перформативы: «Я обещаю»), П. Стросон; позже Дж. Сёрл.

  text: `## Понятие
Постмодернизм — направление в философии и культуре второй половины XX в. (1960–1990-е гг.), прежде всего французское. **Постмодерн** — эпоха после **модерна** (Нового времени с его верой в разум, прогресс, науку и универсальные ценности). Философские истоки: **Ницше**, **Хайдеггер**, **структурализм** (Ф. де Соссюр, К. Леви-Стросс) → **постструктурализм**.
## Общие черты
- **Недоверие к метанарративам** — большим объясняющим теориям (прогресс, эмансипация, марксизм, Просвещение).
- **Плюрализм** и **релятивизм**: множество равноправных истин, языков, культур; нет привилегированной точки зрения.
- **Деконструкция** — выявление скрытых противоречий и иерархий в текстах и понятиях.
- Мир как **текст**; **интертекстуальность** — каждый текст соткан из других текстов (Ю. Кристева).
- **Децентрация субъекта**: «смерть автора», «смерть человека» — субъект создан языком, властью, бессознательным.
- **Ирония**, игра, цитатность, коллаж, фрагментарность, стирание границ высокой и массовой культуры.
- Критика бинарных оппозиций (разум/чувство, мужское/женское, центр/периферия).
## Представители
**Жан-Франсуа Лиотар** (1924–1998), «**Состояние постмодерна**» (1979):
> Упрощая до предела, «постмодерн» — это недоверие к метанарративам.
Знание легитимируется не великими рассказами, а **перформативностью** (эффективностью) и **языковыми играми**; доклад о знании в информационном обществе.
**Жак Деррида** (1930–2004), «**О грамматологии**» (1967), «Письмо и различие»:
- **деконструкция** классических текстов и понятий;
- критика **логоцентризма** (веры в присутствие смысла, истины, разума) и **фоноцентризма** (приоритета речи над письмом);
- **différance** («различАние») — смысл никогда не присутствует полностью, он откладывается и возникает из различий;
- «**Нет ничего вне текста**».
**Мишель Фуко** (1926–1984): «**История безумия**» (1961), «**Слова и вещи**» (1966), «**Археология знания**» (1969), «**Надзирать и наказывать**» (1975), «История сексуальности».
- **Эпистемы** — исторические «коды» знания эпохи; «археология» и «генеалогия» знания.
- **Власть-знание**: знание не нейтрально, оно производится властью и служит ей.
- **Дисциплинарная власть**, нормализация; **паноптикум** (проект тюрьмы И. Бентама) как модель современного общества надзора.
- **Биовласть** — управление жизнью населения.
- «**Смерть человека**»: человек — недавнее изобретение, которое исчезнет, «как лицо, начертанное на прибрежном песке».
**Жиль Делёз** (1925–1995) и **Феликс Гваттари**: «**Анти-Эдип**» (1972), «**Тысяча плато**» (1980) — **ризома** (корневище без центра и иерархии) против «древа» классического знания; номадология, шизоанализ; Делёз — «Различие и повторение».
**Жан Бодрийяр** (1929–2007): «**Общество потребления**» (1970), «**Симулякры и симуляция**» (1981):
- **симулякр** — копия без оригинала, знак, не отсылающий к реальности;
- **гиперреальность** — мир моделей и медиа, который реальнее реального (Диснейленд);
- провокация «**Войны в Заливе не было**» (1991) — война как медийный спектакль.
**Ролан Барт**, «**Смерть автора**» (1967): смысл текста создаёт читатель, а не автор.
Также: Ж. Батай, Ю. Кристева, Р. Рорти (в США), У. Эко (в литературе — «Имя розы»), З. Бауман («текучая современность»).

{

  title: 'Философия виртуальной реальности и искусственного интеллекта',
  lead: 'Философия виртуальности спрашивает, реально ли виртуальное (от пещеры Платона и злого гения Декарта до «мозга в колбе» Патнэма, гипотезы симуляции Бострома и «виртуального реализма» Чалмерса). Философия ИИ обсуждает, может ли машина мыслить (тест Тьюринга, китайская комната Сёрла), каковы риски сверхразума и этические проблемы ИИ.',
  text: `## Виртуальная реальность: понятие
**Виртуальное** (лат. *virtualis* — возможный, потенциальный) у схоластов означало «существующее в возможности». Термин «**виртуальная реальность**» популяризировал **Джарон Ланье** (1980-е). ВР — компьютерно созданная среда, в которую человек погружается и с которой взаимодействует. Смежные понятия: **киберпространство** (У. Гибсон, «Нейромант», 1984), **метавселенная**, дополненная реальность.
## Философские прообразы
- **Пещера Платона**: люди принимают тени за реальность.
- **Чжуан-цзы** и бабочка: как отличить сон от яви?
- **Декарт** — «злой гений», который мог бы обманывать нас относительно всего внешнего мира.

- **Бодрийяр** — симулякры и гиперреальность.
## Современные проблемы
- **«Мозг в колбе»** (Х. Патнэм, 1981): мозг, подключённый к компьютеру, имел бы те же переживания, — как доказать, что мы не такой мозг?

- **«Машина опыта»** (Р. Нозик, 1974): согласились бы вы подключиться навсегда к машине, дающей любые приятные переживания? Большинство отказывается — значит, нам важна подлинная реальность, а не только ощущения.
- **Дэвид Чалмерс**, «**Реальность+**» (2022): **виртуальный реализм** — виртуальные объекты реальны как цифровые объекты, а виртуальная жизнь может быть полноценной.

- **Три закона робототехники** А. Азимова (1942) — ранняя этика машин.
## Может ли машина мыслить?
- **Сильный ИИ** — правильно запрограммированный компьютер действительно обладает разумом и сознанием; **слабый ИИ** — компьютер лишь моделирует мышление, полезный инструмент.
- **Джон Сёрл**, «**Китайская комната**» (1980): человек, не знающий китайского, по инструкциям составляет правильные ответы из иероглифов — внешне «понимает», но на деле нет. Вывод: **синтаксис (манипуляция символами) не порождает семантики (понимания)**; против сильного ИИ.
- **Хьюберт Дрейфус**, «**Чего не могут вычислительные машины**» (1972): человеческий интеллект телесен, опирается на неявное фоновое знание и ситуацию (влияние Хайдеггера).
- **Дэниел Деннет**: «интенциональная установка» — приписывать мысли системе оправдано, если это помогает предсказывать её поведение.
- **Функционализм**: если ментальные состояния — функциональные роли, их может реализовать и кремний (множественная реализуемость).
- Большие языковые модели (с 2020-х): спор, понимают ли они смысл или являются «**стохастическими попугаями**» (Э. Бендер и др., 2021).

  text: `## Понятие
**Культурный поворот** — переориентация философии, социальных и гуманитарных наук в **1970–1990-е гг.** на изучение **культуры** как системы **значений, символов, практик и репрезентаций**, через которые люди понимают мир и действуют. Культура — не «надстройка» и не украшение, а **конститутивная** сила общества.

- **Неокантианство** баденской школы (В. Виндельбанд, Г. Риккерт): **науки о культуре** изучают единичное, отнесённое к **ценностям**, — в отличие от наук о природе.

- **Структурализм** (Леви-Стросс) и **семиотика** (Барт, Лотман — «семиосфера»).

- **Клиффорд Гирц**, «**Интерпретация культур**» (1973): культура — «**паутина значений**», которую человек сам сплёл; задача антрополога — «**насыщенное описание**» (*thick description*) — истолкование смысла действий (подмигивание и моргание).

- **Новая культурная история**: школа «Анналов» (история ментальностей), Л. Хант, П. Бёрк.

- **С. Хантингтон**, «**Столкновение цивилизаций**» (1993/1996): конфликты после холодной войны пойдут по линиям цивилизаций (культурно-религиозных общностей).
## Культурный поворот в науке о науке

## «Повороты» после культурного
По Д. Бахманн-Медик («Культурные повороты», 2006): **интерпретативный**, **перформативный** (культура как действие и представление), **рефлексивный**, **постколониальный**, **переводческий**, **пространственный** (*spatial turn*), **визуальный (иконический)**; позднее — практический (*practice turn*), материальный, аффективный, цифровой.

- **Теория тождества** (**У. Плейс**, 1956; **Дж. Смарт**, 1959): ментальные состояния **тождественны** состояниям мозга (боль = возбуждение С-волокон).
- **Функционализм** (**Х. Патнэм**, Дж. Фодор, 1960-е): ментальное состояние определяется своей **функциональной ролью** (входы, выходы, связи с другими состояниями); **множественная реализуемость** — боль может быть реализована в разных системах (у осьминога, у робота); сознание — как программа (софт) на «железе» мозга.
- **Элиминативный материализм** (**П. и П. Черчленд**): «**народная психология**» (вера, желание) — ложная теория, её заменит нейронаука.
- **Иллюзионизм** (Д. Деннет, К. Франкиш): феноменальное сознание — своего рода иллюзия.
**Другие подходы**:
- **Нейтральный монизм** (Б. Рассел, У. Джеймс).
- **Панпсихизм**: сознание — фундаментальное свойство материи (Ф. Гофф, отчасти Чалмерс); **теория интегрированной информации** Дж. Тонони (Φ).
- **Биологический натурализм** Дж. Сёрла: сознание — реальное биологическое свойство мозга, как пищеварение — желудка.
## Знаменитые аргументы
- **Т. Нагель**, «**Каково быть летучей мышью?**» (1974): сколько бы мы ни знали о мозге летучей мыши и эхолокации, мы не знаем, **каково это** — быть ею; субъективный опыт не схватывается объективной наукой.
- **Ф. Джексон**, **аргумент знания** («**Мэри в чёрно-белой комнате**», 1982): учёная знает всю физику цвета, но, впервые увидев красное, узнаёт нечто новое — значит, физикализм неполон.
- **Философский зомби** (Чалмерс): существо, физически идентичное человеку, но без внутреннего опыта, — если оно мыслимо, сознание не сводится к физике.
- **«Трудная проблема сознания»** (Д. Чалмерс, 1995): **«лёгкие» проблемы** — объяснить функции (внимание, память, отчёт о состояниях); **трудная** — почему и как физические процессы сопровождаются **субъективным переживанием**. **Объяснительный разрыв** (Дж. Левин).
- **Китайская комната** (Сёрл, 1980) — против того, что программа порождает понимание.
- **Д. Деннет**, «**Объяснённое сознание**» (1991): нет «картезианского театра» в мозге; модель «**множественных набросков**».
## Научные теории сознания
- **Глобальное рабочее пространство** (Б. Баарс, С. Деан): сознательно то, что становится доступным многим системам мозга.
- **Теории высшего порядка** (Д. Розенталь): состояние сознательно, если о нём есть мысль.
- **Интегрированная информация** (Тонони).
- **Расширенное сознание** (А. Кларк и Д. Чалмерс, 1998): блокнот Отто как часть его памяти — разум выходит за пределы черепа; **воплощённое познание** (embodied cognition).

  if (REDUCED) { el.textContent = to + suffix; return; }
  const t0 = performance.now(), dur = 800;
  const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suffix; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ===================== Разметка конспекта =====================
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
function planOf(t) { return t.text.split('\n').filter(l => l.startsWith('## ')).map(l => l.slice(3)); }
function rememberOf(t) { const l = t.text.split('\n').find(x => x.startsWith('! ')); return l ? l.slice(2) : ''; }
function renderText(t) {
  let html = '', inList = false, h = 0;
  const close = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of t.text.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const li = line.match(/^(\s*)(-|\d+\.) (.*)$/);
    if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      const sub = li[1].length > 0, num = li[2] !== '-' ? li[2].slice(0, -1) : '';
      html += `<li class="${sub ? 'sub' : ''}${num ? ' num' : ''}"${num ? ` data-n="${num}"` : ''}>${inline(li[3])}</li>`;
      continue;
    }
    close();
    if (!line.trim()) continue;
    if (line.startsWith('## ')) { h++; html += `<h3 id="s${h}"><span class="sn">${h}</span>${inline(line.slice(3))}</h3>`; }
    else if (line.startsWith('> ')) html += `<blockquote>${inline(line.slice(2))}</blockquote>`;
    else if (line.startsWith('! ')) html += `<aside class="remember"><span class="lbl">Запомнить</span>${inline(line.slice(2))}</aside>`;
    else html += `<p>${inline(line)}</p>`;
  }
  close();
  return html;
}

let cleanup = null, pending = null, lastPath = null;
const scrollMem = {};
const depth = () => (history.state && history.state.d) || 1;
try { history.replaceState({ d: depth() }, '', location.hash || '#/'); } catch (e) { /* file:// и др. */ }
function path() { return location.hash.replace(/^#\/?/, ''); }
function go(p) { scrollMem[path()] = window.scrollY; try { history.pushState({ d: depth() + 1 }, '', '#/' + p); } catch (e) { location.hash = '#/' + p; return; } render('fwd'); }
function replaceTo(p) { try { history.replaceState({ d: depth() }, '', '#/' + p); } catch (e) { location.hash = '#/' + p; return; } render('swap'); }
function back(parent = '') { if (depth() > 1) history.back(); else replaceTo(parent); }
function play(fn, cfg, parent) { pending = { fn, cfg, parent }; if (path() === 'play') render('swap'); else go('play'); }
window.addEventListener('popstate', () => render('back'));

function render(nav = 'swap') {
  if (cleanup) { try { cleanup(); } catch (e) { /* ignore */ } cleanup = null; }
  const p = path(), [name, arg] = p.split('/');
  const views = { '': Home, tickets: Tickets, t: Topic, cards: CardsMenu, drill: DrillMenu, exam: ExamMenu, draw: Draw, people: People, progress: Progress };
  app.className = 'enter-' + (REDUCED ? 'none' : nav);
  let r;
  if (name === 'play') {
    if (!pending) { replaceTo(''); return; }
    r = pending.fn(pending.cfg, pending.parent);
  } else {
    const v = views[name] || Home;
    r = v(arg);
  }
  cleanup = typeof r === 'function' ? r : null;
  const y = nav === 'back' && scrollMem[p] ? scrollMem[p] : 0;
  window.scrollTo(0, y);
  lastPath = p;
  void app.offsetWidth;
  app.classList.add('in');
}

const drawState = { skipKnown: true, seen: [] };
function Draw() {
  const choose = () => {

    if (drawState.skipKnown) pool = pool.filter(t => S.self[t.n] !== 'good');
    if (!pool.length) { drawState.seen = []; pool = TOPICS.filter(t => !drawState.skipKnown || S.self[t.n] !== 'good'); }
    if (!pool.length) pool = TOPICS;
    // сначала те, что оценены как «не знаю», затем без оценки

      </div>` : `<p class="hint">Вспомните план ответа: основные идеи, представителей, понятия. Можно проговорить вслух — потом откройте подсказку и сравните.</p>

      <div class="draw-opts"><label class="tgl"><input type="checkbox" id="skip" ${drawState.skipKnown ? 'checked' : ''}><span>Пропускать билеты, отмеченные «знаю»</span></label>

function playCards({ deck, title }, parent) {

  bindBack(parent);

    $('.progress>div').style.width = (done() / total * 100) + '%';

const drillState = store.get('drillState', { eras: allEras(), count: 10 });
const stripPar = s => s.replace(/\s*\([^)]*\)\s*/g, ' ').trim();
const norm = s => stripPar(s).toLowerCase().replace(/[«»"”“.,!?—–-]/g, '').replace(/\s+/g, ' ').trim();
const DRILLS = [
  { id: 'works', icon: 'book', title: 'Чей это труд?', desc: 'Название произведения → автор', has: p => p.works.length },
  { id: 'quotes', icon: 'quote', title: 'Кто это сказал?', desc: 'Цитата или знаменитый тезис → философ', has: p => p.quotes.length },
  { id: 'ideas', icon: 'idea', title: 'Чья это идея?', desc: 'Главная идея учения → мыслитель', has: () => true },
  { id: 'terms', icon: 'cards', title: 'Узнай понятие', desc: 'Определение → термин', has: null },
  { id: 'chrono', icon: 'clock', title: 'Хронология', desc: 'Расставьте четырёх мыслителей по времени', has: () => true },

function distractors(person, pool, conflict) {
  const near = shuffle(pool.filter(p => p.name !== person.name && !conflict(p)))
    .sort((a, b) => Math.abs(a.y - person.y) - Math.abs(b.y - person.y));
  // берём из ближайших по времени, чтобы было не слишком просто
  return shuffle(near.slice(0, 8)).slice(0, 3).map(p => p.name);
}
function buildDrill(kind, eras, count) {
  const sel = new Set(eras);
  const people = PEOPLE.filter(p => sel.has(p.era));
  const peopleAll = people.length >= 6 ? people : PEOPLE;
  const items = [];
  const exp = p => `${p.name} (${p.years}) — ${p.idea}.`;
  if (kind === 'works') {
    people.forEach(p => p.works.forEach(w => items.push({
      id: null, n: p.topics[0], q: `Чей это труд? ${stripPar(w)}`, html: `<span class="q-pre">Чей это труд?</span>${esc(stripPar(w))}`,
      a: p.name, w: distractors(p, peopleAll, o => o.works.some(x => norm(x) === norm(w))), e: exp(p), tag: ERA[p.era].short,
    })));
  } else if (kind === 'quotes') {
    people.forEach(p => p.quotes.forEach(qt => items.push({
      id: null, n: p.topics[0], q: `Кто это сказал? «${qt}»`, html: `<span class="q-pre">Кто это сказал?</span><span class="q-quote">«${esc(qt)}»</span>`,
      a: p.name, w: distractors(p, peopleAll, o => o.quotes.some(x => norm(x) === norm(qt))), e: exp(p), tag: ERA[p.era].short,
    })));
  } else if (kind === 'ideas') {
    people.forEach(p => items.push({
      id: null, n: p.topics[0], q: `Чья это идея? ${p.idea}`, html: `<span class="q-pre">Чья это идея?</span>${esc(p.idea)}`,
      a: p.name, w: distractors(p, peopleAll, o => norm(o.idea) === norm(p.idea)), e: `${p.name} (${p.years}). ${p.works.length ? 'Труды: ' + p.works.map(stripPar).join(', ') + '.' : ''}`, tag: ERA[p.era].short,
    }));
  } else if (kind === 'terms') {
    const terms = TERMS.filter(c => sel.has(c.era));
    const termsAll = terms.length >= 6 ? terms : TERMS;
    terms.forEach(c => {
      const others = shuffle(termsAll.filter(x => x.term !== c.term && norm(x.term) !== norm(c.term)));
      const sameEra = others.filter(x => x.era === c.era);
      const w = (sameEra.length >= 3 ? sameEra : others).slice(0, 3).map(x => x.term);
      items.push({ id: null, n: c.n, q: `Какое понятие определено так: ${c.def}`, html: `<span class="q-pre">Какое понятие так определяется?</span>${esc(c.def)}`, a: c.term, w, e: `Билет ${c.n}: ${BYN[c.n].title}.`, tag: `Билет ${c.n}` });
    });
  }
  return shuffle(items).filter(x => x.w.length === 3).slice(0, count || items.length);
}

      <h2 class="sec">Эпохи</h2>
      ${eraPicker(sel)}
      <div class="chips"><button class="chip" id="all">Все эпохи</button></div>
      <h2 class="sec">Вопросов в раунде</h2>
      ${chipsRow([[10, '10'], [20, '20'], [0, 'Все']], v => v === drillState.count, 'data-c')}
      <h2 class="sec">Упражнения</h2>
      <div class="modes">${DRILLS.map(d => { const a = avail(d); const b = S.best['drill:' + d.id]; return `<button class="mode" data-d="${d.id}" ${a ? '' : 'disabled'}><span class="m-ico">${icon(d.icon)}</span><span class="m-txt"><b>${d.title}</b><small>${d.desc}</small></span><span class="m-meta">${a === '∞' ? 'раунды' : a + ' шт.'}${b ? ` · лучший ${b.pct}%` : ''}</span></button>`; }).join('')}</div>
    </div></div>`;
    bindBack();
    const persist = () => store.set('drillState', drillState);
    bindEraPicker(drillState, () => { persist(); render(); });
    $('#all').onclick = () => { drillState.eras = allEras(); persist(); render(); };
    $$('[data-c]').forEach(x => { x.onclick = () => { drillState.count = +x.dataset.c; persist(); render(); }; });
    $$('[data-d]').forEach(b => {
      b.onclick = () => {
        const d = DRILLS.find(x => x.id === b.dataset.d);
        if (d.id === 'chrono') return play(playChrono, { eras: drillState.eras, rounds: drillState.count || 15 }, 'drill');
        const qs = buildDrill(d.id, drillState.eras, drillState.count);
        if (qs.length) play(playQuiz, { title: d.title, qs, id: 'drill:' + d.id, label: 'Тренировка: ' + d.title }, 'drill');
      };
    });
  };
  render();
}
// Хронология: нажмите на мыслителей по порядку — от самого раннего
function playChrono({ eras, rounds }, parent) {
  const sel = new Set(eras);
  let pool = PEOPLE.filter(p => sel.has(p.era));
  if (pool.length < 4) pool = PEOPLE;
  const gap = ps => { const ys = ps.map(p => p.y).sort((a, b) => a - b); for (let i = 1; i < ys.length; i++) if (ys[i] - ys[i - 1] < (ys[i] < 0 ? 25 : 12)) return false; return true; };
  const makeSet = () => { for (let k = 0; k < 200; k++) { const s = shuffle(pool).slice(0, 4); if (gap(s)) return s; } return shuffle(pool).slice(0, 4); };
  let r = 0, score = 0, set = null, order = [];
  app.innerHTML = `${topbar('Хронология', parent, '<span class="tb-prog"></span>')}<div class="progress"><div></div></div><div class="page"><div class="wrap narrow" id="hw"></div></div>`;
  bindBack(parent);
  const hw = $('#hw');
  function round() {
    if (r >= rounds) return finish();
    set = makeSet(); order = [];
    $('.tb-prog').textContent = `${r + 1} / ${rounds}`;
    $('.progress>div').style.width = (r / rounds * 100) + '%';
    draw(false);
  }
  function draw(checked) {
    const sorted = set.slice().sort((a, b) => a.y - b.y);
    hw.innerHTML = `<div class="qcard"><div class="q-tag">Хронология</div><h2 class="q-text">Нажмите на мыслителей по порядку — от самого раннего к самому позднему</h2>
      <div class="chrono">${set.map((p, k) => { const pos = order.indexOf(k); const correct = checked ? sorted.indexOf(p) : -1; const ok = checked && pos === correct; return `<button class="ch-item ${pos >= 0 ? 'picked' : ''} ${checked ? (ok ? 'right' : 'wrong') : ''}" data-k="${k}" ${checked ? 'disabled' : ''}><span class="ch-pos">${pos >= 0 ? pos + 1 : ''}</span><span class="ch-name">${esc(p.name)}</span>${checked ? `<span class="ch-years">${esc(p.years)}</span>` : ''}</button>`; }).join('')}</div>
      <div id="after">${checked ? `<div class="explain ${order.every((k, i) => sorted[i] === set[k]) ? 'ok' : 'bad'}"><b>Правильный порядок:</b><ol class="ch-sol">${sorted.map(p => `<li><b>${esc(p.name)}</b> — ${esc(p.years)}</li>`).join('')}</ol></div><button class="btn wide" id="next">${r + 1 < rounds ? 'Дальше' : 'Результат'}</button>` : (order.length ? '<button class="btn ghost wide" id="undo">Сбросить выбор</button>' : '')}</div></div>`;
    if (!checked) {
      $$('.ch-item', hw).forEach(b => { b.onclick = () => {
        const k = +b.dataset.k, pos = order.indexOf(k);
        if (pos >= 0) order = order.slice(0, pos); else order.push(k);
        if (order.length === 4) { const ok = order.every((kk, i) => set.slice().sort((a, c) => a.y - c.y)[i] === set[kk]); if (ok) score++; else buzz(); draw(true); }
        else draw(false);
      }; });
      const u = $('#undo'); if (u) u.onclick = () => { order = []; draw(false); };
    } else {
      $('#next').onclick = () => { r++; round(); };
      $('#next').focus({ preventScroll: true });
    }
  }
  function finish() {
    const pct = Math.round(score / rounds * 100);
    saveBest('drill:chrono', pct, 'Тренировка: хронология');
    $('.progress>div').style.width = '100%'; $('.tb-prog').textContent = '';
    hw.innerHTML = `<div class="result"><div class="r-score">${pct}%</div><div class="r-stars">${stars(pct)}</div><div class="r-sub">Без ошибок ${score} из ${rounds}</div><p class="r-verdict">Опорные даты удобно запоминать «якорями»: Сократ — 399 до н. э., Августин — V в., Фома — XIII в., Декарт — 1637, Кант — 1781, Гегель — 1807.</p></div>
      <div class="btnrow"><button class="btn ghost" id="menu">Готово</button><button class="btn" id="again">Ещё раз</button></div>`;
    countUp($('.r-score', hw), pct, '%');
    $('#menu').onclick = () => back(parent);
    $('#again').onclick = () => play(playChrono, { eras, rounds }, parent);
  }
  const onKey = e => { if (e.key === 'Enter' && $('#next') && document.activeElement !== $('#next')) { e.preventDefault(); $('#next').click(); } };
  document.addEventListener('keydown', onKey);
  round();
  return () => document.removeEventListener('keydown', onKey);
}

// ===================== Персоналии =====================
const peopleState = { q: '' };
function People() {
  const render = () => {
    const q = peopleState.q.trim().toLowerCase();
    const match = p => !q || [p.name, p.idea, p.years, ...p.works, ...p.quotes].join(' ').toLowerCase().includes(q);
    const groups = ERAS.map(e => ({ e, items: PEOPLE.filter(p => p.era === e.id && match(p)).sort((a, b) => a.y - b.y) })).filter(g => g.items.length);
    $('#pl').innerHTML = groups.length ? groups.map(g => `<section class="tl-group" data-era="${g.e.id}"><h2 class="era-h"><span>${esc(g.e.name)}</span></h2><ol class="timeline">${g.items.map(p => `<li class="tl-item"><details><summary><span class="tl-years">${esc(p.years)}</span><span class="tl-name">${esc(p.name)}</span><span class="tl-idea">${esc(p.idea)}</span></summary>
      <div class="tl-more">${p.works.length ? `<p><b>Труды:</b> ${p.works.map(esc).join('; ')}</p>` : ''}${p.quotes.length ? p.quotes.map(x => `<blockquote>${esc(x)}</blockquote>`).join('') : ''}<p class="tl-links">${p.topics.map(n => `<a href="#/t/${n}" data-go="t/${n}">Билет ${n}</a>`).join('')}</p></div></details></li>`).join('')}</ol></section>`).join('') : '<p class="empty">Никого не найдено.</p>';
    bindLinks($('#pl'));
  };
  app.innerHTML = `${topbar('Персоналии')}<div class="page"><div class="wrap narrow">
    <label class="search">${icon('search')}<input type="search" id="q" placeholder="Имя, труд или идея…" value="${esc(peopleState.q)}" autocomplete="off"></label>
    <button class="btn ghost wide" id="chrono">${icon('clock')}Тренировка: хронология</button>
    <div id="pl"></div>
  </div></div>`;
  bindBack();
  $('#q').oninput = e => { peopleState.q = e.target.value; render(); };
  $('#chrono').onclick = () => play(playChrono, { eras: allEras(), rounds: 10 }, 'people');
  render();
}

// ===================== Прогресс =====================
function Progress() {
  let confirm = false;
  const render = () => {
    const read = Object.keys(S.read).length;
    const known = TERMS.filter(c => S.cards[c.id] === 1).length;
    const tested = Object.keys(S.test).length;
    const avg = tested ? Math.round(Object.values(S.test).reduce((a, b) => a + b, 0) / tested) : 0;
    const v = Object.values(S.self);
    const best = Object.entries(S.best).filter(([k]) => !k.startsWith('topic:')).sort((a, b) => b[1].at - a[1].at);
    app.innerHTML = `${topbar('Мой прогресс')}<div class="page"><div class="wrap narrow">
      <div class="stats">
        <div class="stat"><b>${read}</b><span>из ${TOPICS.length} билетов изучено</span></div>
        <div class="stat"><b>${tested ? avg + '%' : '—'}</b><span>средний тест по билетам (${tested})</span></div>
        <div class="stat"><b>${known}</b><span>из ${TERMS.length} карточек выучено</span></div>
        <div class="stat"><b>${v.filter(x => x === 'good').length}</b><span>билетов отмечено «знаю»</span></div>
      </div>
      <h2 class="sec">Билеты по эпохам</h2>
      <div class="breakdown">${ERAS.map(e => { const ts = TOPICS.filter(t => t.era === e.id), r = ts.filter(t => S.read[t.n]).length; return `<div class="bd-row" data-era="${e.id}"><span>${esc(e.short)}</span><span class="bd-bar"><i style="width:${r / ts.length * 100}%"></i></span><b>${r}/${ts.length}</b></div>`; }).join('')}</div>
      <h2 class="sec">Карта билетов</h2>
      <div class="grid50">${TOPICS.map(t => { const p = S.test[t.n], s = S.self[t.n]; const cls = s === 'good' || p >= 80 ? 'good' : s === 'part' || p >= 50 ? 'mid' : s === 'bad' || p != null ? 'low' : S.read[t.n] ? 'read' : ''; return `<a href="#/t/${t.n}" data-go="t/${t.n}" class="cell ${cls}" title="${esc(t.title)}">${t.n}</a>`; }).join('')}</div>
      <div class="legend"><span><i class="cell-dot good"></i>знаю / тест от 80%</span><span><i class="cell-dot mid"></i>частично</span><span><i class="cell-dot low"></i>слабо</span><span><i class="cell-dot read"></i>прочитан</span></div>
      ${best.length ? `<h2 class="sec">Лучшие результаты</h2><div class="list">${best.map(([k, b]) => `<div class="lrow"><span>${esc(b.label || k)}</span><b class="${b.pct >= 80 ? 'good' : b.pct >= 50 ? 'mid' : 'low'}">${b.pct}%</b></div>`).join('')}</div>` : ''}
      <div class="reset">${confirm ? `<p>Удалить весь прогресс по философии на этом устройстве?</p><div class="btnrow"><button class="btn ghost" id="no">Отмена</button><button class="btn danger" id="yes">Удалить</button></div>` : '<button class="btn ghost wide" id="rst">Сбросить прогресс</button>'}</div>
    </div></div>`;
    bindBack(); bindLinks();
    const on = (id, f) => { const el = $('#' + id); if (el) el.onclick = f; };
    on('rst', () => { confirm = true; render(); });
    on('no', () => { confirm = false; render(); });
    on('yes', () => { ['read', 'test', 'cards', 'self', 'wrong', 'best'].forEach(k => { S[k] = {}; save(k); }); S.last = 0; save('last'); confirm = false; render(); });
  };
  render();
}

// ===================== Старт =====================
render('swap');
})();

</script>
